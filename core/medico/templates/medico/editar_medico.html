{% extends 'medico/base.html' %}

{% block content %}
    <h2>Editando Médico: {{ medico.nome }} {{ medico.sobrenome }}</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="nome_input">Nome:</label>  
            <input type="text" class="form-control" id="nome_input" name="nome" value="{{ medico.nome }}" required>
        </div>
        <div class="form-group">
            <label for="sobrenome_input">Sobrenome:</label>  
            <input type="text" class="form-control" id="sobrenome_input" name="sobrenome" value="{{ medico.sobrenome }}" required>
        </div>
        <div class="form-group">
            <label for="email_input">Email:</label>  
            <input type="email" class="form-control" id="email_input" name="email" value="{{ medico.email }}" required>
        </div>
        <div class="form-group">
            <label for="especialidades_select">Especialidades:</label>  
            <select name="especialidades" class="form-control" id="especialidades_select" multiple required>
                {% for especialidade in especialidades %}
                    <option value="{{ especialidade.id }}" 
                        {% if especialidade in medico.nome_especialidade.all %}selected{% endif %}>
                        {{ especialidade.nome_especialidade }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn">Salvar Alterações</button>
    </form>
      
    <div class="mt-3">
        <a href="{% url 'lista_medicos' %}">Cancelar e voltar para a lista</a>
    </div>
{% endblock %}
