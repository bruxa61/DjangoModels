{% extends 'base.html' %}

{% block title %}Cadastrar Especialidade{% endblock %}

{% block content %}
    <h2>Cadastro de Nova Especialidade</h2>
    <form method="post">
        <div>
            <label for="nome">Nome da Especialidade:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <button type="submit">Salvar</button>
    </form>
{% endblock %}
